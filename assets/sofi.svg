
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none"> <defs> <!-- Metallic Gold Gradient matching SoundFaith palette --> <linearGradient id="goldGrad" x1="20%" y1="10%" x2="80%" y2="90%"> <stop offset="0%" stop-color="#E6CFA3" /> <stop offset="45%" stop-color="#C8A96E" /> <stop offset="100%" stop-color="#9A7B46" /> </linearGradient> <!-- Deep Teal Gradient matching SoundFaith palette --> <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" stop-color="#89b2a5" /> <stop offset="100%" stop-color="#5f9185" /> </linearGradient> </defs> <!-- Outer Compass Ring Segments (sharp geometric arcs broken by cardinal points) --> <g stroke="url(#tealGrad)" stroke-width="3.6" stroke-linecap="butt"> <!-- Top-Right Arc --> <path d="M 56.5 17.2 A 19.5 19.5 0 0 1 68.8 29.5" /> <!-- Bottom-Right Arc --> <path d="M 68.8 42.5 A 19.5 19.5 0 0 1 56.5 54.8" /> <!-- Bottom-Left Arc --> <path d="M 43.5 54.8 A 19.5 19.5 0 0 1 31.2 42.5" /> <!-- Top-Left Arc --> <path d="M 31.2 29.5 A 19.5 19.5 0 0 1 43.5 17.2" /> </g> <!-- Secondary Diagonal Compass Points (45 deg) --> <g fill="url(#goldGrad)"> <!-- Top-Right --> <polygon points="50,36 62.5,23.5 53,39" /> <polygon points="50,36 62.5,23.5 47,33" opacity="0.82" /> <!-- Bottom-Right --> <polygon points="50,36 62.5,48.5 47,39" /> <polygon points="50,36 62.5,48.5 53,33" opacity="0.82" /> <!-- Bottom-Left --> <polygon points="50,36 37.5,48.5 47,33" /> <polygon points="50,36 37.5,48.5 53,39" opacity="0.82" /> <!-- Top-Left --> <polygon points="50,36 37.5,23.5 53,33" /> <polygon points="50,36 37.5,23.5 47,39" opacity="0.82" /> </g> <!-- Primary Cardinal Compass Star Points (North, East, South, West) --> <g fill="url(#goldGrad)"> <!-- North (elongated guiding point) --> <polygon points="50,8.5 54.6,31.5 50,36" /> <polygon points="50,8.5 45.4,31.5 50,36" opacity="0.78" /> <!-- South --> <polygon points="50,61.5 54.6,40.5 50,36" /> <polygon points="50,61.5 45.4,40.5 50,36" opacity="0.78" /> <!-- East --> <polygon points="75.5,36 54.6,31.5 50,36" /> <polygon points="75.5,36 54.6,40.5 50,36" opacity="0.78" /> <!-- West --> <polygon points="24.5,36 45.4,31.5 50,36" /> <polygon points="24.5,36 45.4,40.5 50,36" opacity="0.78" /> </g> <!-- Center Medallion with Crisp Chi-Rho Monogram --> <circle cx="50" cy="36" r="8.6" fill="#FAF8F5" stroke="url(#goldGrad)" stroke-width="1.2" /> <g stroke="#9A7B46" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"> <!-- Vertical Stem (Rho) --> <line x1="50" y1="30" x2="50" y2="42" /> <!-- Rho Loop --> <path d="M 50 30 H 52.1 A 2.1 2.1 0 0 1 52.1 34.2 H 50" fill="none" /> <!-- Chi Crossbars --> <line x1="46.2" y1="33.8" x2="53.8" y2="39.6" /> <line x1="53.8" y1="33.8" x2="46.2" y2="39.6" /> </g> <!-- Vessel's Wake / Pilgrim's Path (S-Curve) --> <!-- Primary Deep Teal Path --> <path d="M 46.5 57.5 C 34 60, 32 67.5, 48.5 70 C 66 72.5, 67 83.5, 31 87.5 C 49 87.5, 72 82.5, 71 72 C 70 64.5, 52 63.5, 43.5 62 C 39.5 61.3, 41.5 59, 46.5 57.5 Z" fill="url(#tealGrad)" /> <!-- Secondary Accent Wake Trail --> <path d="M 65.5 78.5 C 63 84.5, 53 87, 45.5 87.8 C 56 88.2, 68.5 85.5, 68.5 79.5 C 68.5 78.5, 66.5 77.5, 65.5 78.5 Z" fill="url(#tealGrad)" opacity="0.85" /> </svg> 